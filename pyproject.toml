[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litesandbox"
version = "0.3.0"
description = "Synchronous Python SDK and local Docker sandbox service for agents"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["litesandbox_client"]

[tool.setuptools.packages.find]
where = ["src"]
